name: GlucoseWidget
options:
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ${DEVELOPMENT_TEAM}

targets:
  GlucoseWidget:
    type: application
    platform: macOS
    sources:
      - path: App
        excludes:
          - "*.entitlements"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ${BUNDLE_ID_PREFIX}
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.healthcare-fitness
        ENABLE_HARDENED_RUNTIME: YES
        COMBINE_HIDPI_IMAGES: YES
        CODE_SIGN_ENTITLEMENTS: App/GlucoseWidget.entitlements
    dependencies:
      - target: GlucoseWidgetExtension
        embed: true

  GlucoseWidgetExtension:
    type: app-extension
    platform: macOS
    sources:
      - path: Widget
        excludes:
          - "*.entitlements"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ${BUNDLE_ID_PREFIX}.GlucoseWidgetExtension
        INFOPLIST_FILE: Widget/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_ENTITLEMENTS: Widget/GlucoseWidgetExtension.entitlements

  GlucoseWidgetTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - Tests
      - path: Widget/GlucoseReading.swift
      - path: Widget/GlucoseRange.swift
      - path: Widget/TrendArrow.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ${BUNDLE_ID_PREFIX}.tests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  GlucoseWidget:
    build:
      targets:
        GlucoseWidget: all
        GlucoseWidgetExtension: all
    test:
      targets:
        - GlucoseWidgetTests
